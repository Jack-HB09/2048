<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Home</title>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="home.css">
    <script src="game-catalog.js" defer></script>
    <script src="navigation.js" defer></script>
</head>
<body>
    <main class="home-page">
        <nav class="site-nav" aria-label="Main navigation">
            <span class="site-brand">Little Arcade</span>
            <div class="site-nav-actions">
                <button class="nav-button" type="button" data-navigation-target="games">Browse games</button>
            </div>
        </nav>
        <section class="home-content" aria-labelledby="welcome-title">
            <div class="home-intro">
                <p class="eyebrow">A small collection of browser games</p>
                <h1 id="welcome-title">A good game is just a click away.</h1>
                <p class="intro">Take a quick break with a puzzle you can play right here in your browser.</p>
                <button class="primary-button" type="button" data-navigation-target="games">Explore the game library</button>
            </div>
            <section class="featured-section" aria-labelledby="featured-title">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">A place to start</p>
                        <h2 id="featured-title">Featured game</h2>
                    </div>
                </div>
                <div data-featured-game="2048"></div>
            </section>
        </section>
    </main>
</body>
</html>
